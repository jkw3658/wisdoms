name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: wisdoms-apk
          path: app/build/outputs/apk/release/app-release.apk
      # main のビルドは「latest」リリースに APK をそのまま置き、
      # https://github.com/<owner>/<repo>/releases/latest/download/wisdoms.apk で直接ダウンロードできるようにする
      - name: Publish APK to latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk wisdoms.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest wisdoms.apk \
            --target "$GITHUB_SHA" \
            --title "最新版 (#${GITHUB_RUN_NUMBER})" \
            --notes "ビルド日時: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') / コミット: ${GITHUB_SHA::7}"
